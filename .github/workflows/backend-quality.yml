name: Backend quality

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-quality.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-quality.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: booking_dashboard_test
          MYSQL_USER: booking_test
          MYSQL_PASSWORD: booking_test_ci
          MYSQL_ROOT_PASSWORD: booking_root_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pbooking_root_ci --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s
          --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: mysql://booking_test:booking_test_ci@127.0.0.1:3306/booking_dashboard_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check server.js
      - run: npm test
      - run: npm audit --audit-level=high
