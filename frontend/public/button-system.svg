  <text x="330" y="283" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Default</text>
  <rect x="448" y="255" width="180" height="44" rx="8" fill="#1257B1"/>
  <text x="538" y="283" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Hover</text>
  <rect x="656" y="255" width="180" height="44" rx="8" fill="#0F4B99"/>
  <text x="746" y="283" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Active</text>
