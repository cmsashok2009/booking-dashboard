<svg width="1280" height="820" viewBox="0 0 1280 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Booking Dashboard Button System</title>
  <desc id="desc">Shared button types and states with colors for the booking dashboard frontend.</desc>
  <rect width="1280" height="820" rx="28" fill="#F6F8FC"/>
  <text x="56" y="76" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Booking Dashboard button system</text>
  <text x="56" y="112" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Reusable component variants and state colors used across the frontend.</text>

  <rect x="56" y="148" width="1168" height="612" rx="24" fill="#FFFFFF" stroke="#DCE4F0"/>

  <text x="88" y="196" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Types</text>
  <text x="88" y="226" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Primary, secondary, ghost, danger, and quiet danger are the shared variants.</text>

  <text x="88" y="280" fill="#334155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Primary</text>
