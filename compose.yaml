name: booking-dashboard

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: booking_dashboard
      MYSQL_USER: booking_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [app-network]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app-network]

  database-init:
    build:
      context: ./backend
    restart: "no"
    command: ["node", "scripts/initialize-production-state.js"]
    environment: &backend-environment
      NODE_ENV: production
      PORT: 5178
      APP_URL: ${APP_URL:-http://localhost:3000}
      PERSISTENCE_DRIVER: mysql
      DATABASE_URL: mysql://booking_app:${MYSQL_PASSWORD}@mysql:3306/booking_dashboard
      DB_SSL: "false"
      RATE_LIMIT_DRIVER: redis
      REDIS_URL: redis://redis:6379
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-System Administrator}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      ALLOW_DEMO_CREDENTIALS: "false"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-mock}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [app-network]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      database-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5178/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [app-network]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:5178
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [app-network]

volumes:
  mysql-data:
  redis-data:

networks:
  app-network:
    driver: bridge